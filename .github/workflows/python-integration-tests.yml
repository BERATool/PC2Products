name: Python Tests / Integration

on:
  pull_request:
    branches:
      - main
    paths:
      - 'beratools/**'
      - 'tests/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-integration-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'beratools/**'
      - 'tests/**'
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pyproject.toml'
      - '.github/workflows/python-integration-tests.yml'

jobs:
  integration:
    name: Pixi integration
    # R packages come prebuilt from conda-forge on linux-64 (see pixi.toml)
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checking out code"
        run: echo "Checking out code"
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          persist-credentials: true

      - name: Install Pixi
        run: echo "Installing Pixi" && curl -fsSL https://pixi.sh/install.sh | bash

      - name: Setup Pixi Environment
        run: |
          echo "Setting up Pixi environment"
          export PATH="$HOME/.pixi/bin:$PATH"
          cd $GITHUB_WORKSPACE
          pixi install
      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Run R test (installs missing R packages into the pixi R)
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi run pytest tests/test_r_environment.py \
            --cov=beratools \
            --cov-report=term \
            --maxfail=1 \
            --disable-warnings \
            --log-cli-level=INFO

      - name: Run workflow test
        run: |
          export PATH="$HOME/.pixi/bin:$PATH"
          pixi run pytest  tests/test_workflow.py \
            --cov=beratools \
            --cov-report=term \
            --maxfail=1 \
            --disable-warnings \
            --log-cli-level=INFO