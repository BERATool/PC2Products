name: Python Tests / Compatibility Matrix

on:
  workflow_dispatch:

jobs:
  compatibility:
    name: Tox / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            toxenv: py312
            networkit: networkit
          - python-version: "3.13"
            toxenv: py313
            networkit: networkit
          # conda-forge has no networkit build for Python 3.14
          - python-version: "3.14"
            toxenv: py314
            networkit: ""

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          persist-credentials: true
          fetch-depth: 1

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: bera-tox
          create-args: >-
            python=${{ matrix.python-version }}
            gdal>=3.12,<4
            geopandas
            ${{ matrix.networkit }}
            numpy>=1.26,<2.4
            pandas
            pyogrio>=0.12
            pyqt
            rasterio>=1.5
            tqdm
            xarray-spatial
            igraph
            psutil
            hydra-core
            pytest
            pytest-qt
            tox
            r-base>=4.5,<4.6
            rpy2
            r-lidr
            r-rlas
            r-rcsf
            r-future
            r-terra
            r-sp
            r-raster
            r-stars
            r-sf
            r-gstat
          condarc: |
            channel_priority: strict
            channels:
              - conda-forge
              - appliedgrg
          cache-environment: true

      - name: Install project
        shell: bash -el {0}
        run: |
          python -m pip install -e . --no-deps

      - name: Run Tests
        shell: bash -el {0}
        run: |
          tox -e ${{ matrix.toxenv }}
