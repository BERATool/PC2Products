name: Deploy Docs to GitHub Pages

permissions:
  contents: read
  pages: write
  id-token: write

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/mkdocs-gh-pages.yml'
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - '.github/workflows/mkdocs-gh-pages.yml'

# Run one Pages deployment at a time, and let an in-progress deployment finish
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test-docs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/files/requirements.txt
      # The docs need only Zensical and mkdocstrings; mkdocstrings reads beratools from source
      - name: Install documentation dependencies
        run: pip install -r docs/files/requirements.txt
      - name: Build docs site
        run: zensical build -f docs/mkdocs.yml

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/files/requirements.txt
      # The docs need only Zensical and mkdocstrings; mkdocstrings reads beratools from source
      - name: Install documentation dependencies
        run: pip install -r docs/files/requirements.txt
      - name: Build docs site
        run: zensical build -f docs/mkdocs.yml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
