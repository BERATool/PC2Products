[workspace]
authors = ["Maverick <87385184+Maverick-F@users.noreply.github.com>"]
channels = ["nodefaults", "conda-forge","appliedgrg",]
description = "PC2Products: the subset of BERA Tools that turns LiDAR point clouds into raster products"
name = "PC2Products"
platforms = ["win-64", "linux-64"]
version = "0.1.0"
repository = "https://github.com/BERATool/PC2Products"

[tasks]
main_tk = "python main.py"
main = "python ./beratools/gui/main.py"

[dependencies]
python = ">=3.14,<3.15"

gdal = ">=3.12,<4"
dask = "*"
numpy = ">=1.26,<2.4"
pyarrow = "*"
pyogrio = ">=0.9.0"
pygments = ">=2.20"
pyqt = "*"
rasterio = "*"
scikit-image = ">=0.24.0"
tabulate = "*"
tqdm = "*"
xarray-spatial = "*"

pytest = "*"
pytest-qt = "*"
pytest-cov = "*"
coverage = "*"

pandarallel = "1.6.*"
igraph = "*"
psutil = "*"
hydra-core = "*"

# R only: the tools install the R packages they need (lidR, terra, sf, ...) into this R on first use.
# Held at 4.5.x because conda-forge's linux-64 rpy2 is only built for R 4.5.
r-base = ">=4.5,<4.6"

[target.linux-64.dependencies]
rpy2 = "*"
# CRAN only ships source packages for Linux, and the GDAL/GEOS/PROJ-linked ones (terra, sf, ...)
# fail to compile against the pixi R, so take the prebuilt conda-forge builds on linux-64.
# win-64 keeps installing CRAN binaries at runtime (conda-forge has no R 4.5 win-64 builds).
r-lidr = "*"
r-rlas = "*"
r-rcsf = "*"
r-future = "*"
r-terra = "*"
r-sp = "*"
r-raster = "*"
r-stars = "*"
r-sf = "*"
r-gstat = "*"

# conda-forge has no win-64 rpy2 build for R 4.5, so install it from PyPI
[target.win-64.pypi-dependencies]
rpy2 = "*"

[pypi-dependencies]
hatch-vcs = "*"
pc2products = { path = ".", editable = true }
zensical = "==0.0.53"
mkdocstrings = "*"
mkdocstrings-python = "*"
pymdown-extensions = "*"
